[project]
name = "ai-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "openai>=2.41.1",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
    "celery>=5.6.3",
    "dotenv>=0.9.9",
    "ddgs>=9.14.4",
    "openai-agents[any-llm,sqlalchemy]>=0.17.2",
    "redis>=7.4.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "greenlet>=3.5.1",
    "scalar-fastapi>=1.8.2",
    "pandas>=3.0.3",
    "numpy>=2.5.1",
    "matplotlib>=3.11.0",
    "pypdf>=6.14.2",
    "openpyxl>=3.1.5",
    "markdown>=3.10.2",
    "chromadb>=1.5.9",
    "sqlmodel>=0.0.24",
    "pydantic-settings>=2.0.0",
    "mistralai>=2.4.8",
    "python-multipart>=0.0.20",
