# Nginx Virtual Host Configuration for notes.zerohero.my.id
# Copy this file to /etc/nginx/sites-available/notes.zerohero.my.id
# And create a symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name notes.zerohero.my.id;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notes.zerohero.my.id;

    # SSL Certificates Configuration (managed via Let's Encrypt Certbot)
    # Once you run certbot, it will automatically populate these lines.
    # ssl_certificate /etc/letsencrypt/live/notes.zerohero.my.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/notes.zerohero.my.id/privkey.pem;

    # Secure SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Maximum file upload size (crucial for document attachments)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/notes.zerohero.my.id.access.log;
    error_log /var/log/nginx/notes.zerohero.my.id.error.log;

    location / {
        # Reverse proxy to the Docker container listening on localhost port 3000
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Keepalive and WebSocket support headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Client details headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
